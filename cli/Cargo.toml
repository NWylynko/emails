[package]
name = "emails"
version = "0.1.0"
edition = "2021"
description = "CLI for receiving *@wylynko.me mail via email-service"
license = "MIT"
readme = "README.md"

[[bin]]
name = "emails"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
