onlyBuiltDependencies:
  - '@clerk/shared'
  - esbuild
  - workerd
  # Fetches the platform binary in a preinstall hook. Must be allow-listed or
  # the hook is skipped and node_modules/.bin/infisical is never created.
  - '@infisical/cli'

# Supply-chain cooldown: refuse any package version published less than 3 days
# ago, so compromised releases have time to be caught and yanked. pnpm 11
# defaults to 1440 (1 day); this triples it. Units are minutes.
minimumReleaseAge: 4320

# varlock's Next.js integration works by replacing Next's own env loader.
# Required by @varlock/nextjs-integration; overrides are read from here.
#
# Held on 1.x, here and in package.json. 2.x freezes the env into OpenNext /
# Workers Builds output *encrypted*, so it needs a new _VARLOCK_ENV_KEY secret
# at build time (or the build fails) AND in the Worker's runtime secret store
# (or every request fails). Adopt 2.x only together with that key in Infisical
# prod/dev and the Cloudflare secret sync. Bump both majors together.
overrides:
  "@next/env": "npm:@varlock/nextjs-integration@^1.2.5"

minimumReleaseAgeExclude:
  # Pinned versions only: each entry exempts exactly one release, so remove it
  # once the lockfile has moved past that version.
  - sonner@2.0.8

allowBuilds:
  '@infisical/cli': true
  esbuild: true
  workerd: true
