onlyBuiltDependencies:
  - '@clerk/shared'
  - esbuild
  - workerd
  # Fetches the platform binary in a preinstall hook. Must be allow-listed or
  # the hook is skipped and node_modules/.bin/infisical is never created.
  - '@infisical/cli'

# Supply-chain cooldown: refuse any package version published less than 3 days
# ago, so compromised releases have time to be caught and yanked. pnpm 11
# defaults to 1440 (1 day); this triples it. Units are minutes.
minimumReleaseAge: 4320

# varlock's Next.js integration works by replacing Next's own env loader.
# Required by @varlock/nextjs-integration; overrides are read from here.
overrides:
  "@next/env": "npm:@varlock/nextjs-integration"

minimumReleaseAgeExclude:
  - lucide-react@1.31.0
  # 16.3.3 is a security release — two critical unauthenticated RCEs (Windows
  # hosts; Image Optimization via AVIF). Neither reaches this app, but waiting
  # out the cooldown on an RCE fix is the wrong side of the trade. Exempted the
  # day it shipped. The swc binaries are listed one by one because pnpm rejects
  # a name pattern carrying a version (`@next/swc-*@16.3.3`), and an unpinned
  # `@next/swc-*` would exempt every future release too.
  - next@16.3.3
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - miniflare@5.20260804.0-alpha
  - react-hook-form@7.85.0
  - sonner@2.0.8
  - varlock@1.16.1
  - wrangler@4.120.1

allowBuilds:
  '@infisical/cli': true
  esbuild: true
  workerd: true
